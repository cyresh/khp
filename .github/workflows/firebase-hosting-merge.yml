# This file was auto-generated by the Firebase CLI, then extended by hand
# to also deploy firestore.rules (the CLI wizard only sets up Hosting).
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KHP_ATTENDANCE }}
          channelId: live
          projectId: khp-attendance

      # ---- Firestore rules -------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account to file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KHP_ATTENDANCE }}' > /tmp/firebase-sa.json

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project khp-attendance
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json