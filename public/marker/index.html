<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KHTPC Marker</title>
  <meta name="theme-color" content="#1a73e8" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="../shared/design-system.css" />
  <style>
    :root { --accent: #1a73e8; --accent-dark: #14559e; --accent-contrast: #ffffff; }
    .login-screen { display: flex; flex-direction: column; min-height: 100vh; }
    .login-screen__body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: var(--space-4); }
    .app-shell { display: none; }
  </style>
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div id="college-header-mount"></div>
    <div class="login-screen__body">
      <h2 style="text-align:center;">Marker Login</h2>
      <div id="pin-login-mount"></div>
    </div>
  </div>

  <div id="app-shell" class="app-shell">
    <div id="college-header-mount-2"></div>
    <div id="marker-app-mount"></div>
  </div>

  <script type="module">
    import { initFirebase } from "../shared/firebase-init.js";
    import { loginWithPin, signInWithStoredSecret, logout, onAuthChange } from "../shared/auth.js";
    import { renderCollegeHeader } from "../shared/college-header.js";
    import { mountPinLogin } from "../shared/pin-keypad.js";
    import { mountMarkerApp } from "./app.js";
    import { mountOfflineBanner } from "../shared/offline-banner.js";
    import {
      getLastStaffId, setLastStaffId,
      isPlatformAuthenticatorAvailable, getSavedBiometric,
      unlockWithBiometric, clearSavedBiometric, maybeOfferBiometricEnroll,
    } from "../shared/biometric-auth.js";

    const APP_NAME = "marker";

    // Must run before any login/auth function above is actually
    // CALLED — see shared/firebase-init.js for why naming this app
    // "marker" gives it its own Auth session, independent of the
    // admin app's, even on the same device.
    initFirebase("marker");

    mountOfflineBanner();

    const loginScreen = document.getElementById("login-screen");
    const appShell = document.getElementById("app-shell");
    const markerAppMount = document.getElementById("marker-app-mount");

    renderCollegeHeader(document.getElementById("college-header-mount"), { compact: true });
    renderCollegeHeader(document.getElementById("college-header-mount-2"), { compact: true });

    // Holds {staffId, name, email, password} from the most recent
    // manual PIN login, so the fingerprint-enrollment banner can be
    // offered once the app shell is mounted. Left null after a
    // biometric login (already enabled) or once consumed.
    let pendingBiometricOffer = null;
    let pinLogin = null;
    let mountedForUid = null;
    let activeListenerUnsub = null;

    function stopActiveListener() {
      if (activeListenerUnsub) {
        activeListenerUnsub();
        activeListenerUnsub = null;
      }
    }

    // Watches this user's own profile doc for as long as they're signed
    // in. If an admin resets their PIN or deactivates them while this
    // tab stays open, `active` flips to false in Firestore — without
    // this listener the already-open session would just keep working
    // until the browser session naturally expires, since Firebase Auth
    // sessions persist locally and aren't auto-revoked by adminResetPin()
    // / setUserActive() (no Cloud Functions on the Spark plan to force
    // that server-side).
    async function watchOwnActiveStatus(uid) {
      const { db } = await import("../shared/firebase-init.js");
      const { doc, onSnapshot } = await import(
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      );
      stopActiveListener();
      activeListenerUnsub = onSnapshot(doc(db, "users", uid), (snap) => {
        if (!snap.exists() || snap.data().active === false) {
          stopActiveListener();
          logout();
        }
      });
    }

    // Wrapped in an async IIFE (rather than top-level await) so this
    // still parses and runs on older module-supporting browsers that
    // don't support top-level await.
    (async () => {
      const biometricAvailable = await isPlatformAuthenticatorAvailable();

      pinLogin = mountPinLogin(document.getElementById("pin-login-mount"), {
        pinLength: 6,
        staffIdPlaceholder: "e.g. mech, cse, bus16",
        initialStaffId: getLastStaffId(APP_NAME),
        biometric: {
          available: biometricAvailable && !!getSavedBiometric(APP_NAME),
          onUse: async () => {
            let secret;
            try {
              secret = await unlockWithBiometric(APP_NAME);
            } catch (err) {
              throw new Error(err.message || "Fingerprint check failed.");
            }
            try {
              await signInWithStoredSecret(secret.email, secret.password);
              setLastStaffId(APP_NAME, secret.staffId);
            } catch (err) {
              // Saved secret no longer works (PIN was reset, account
              // deactivated, etc.) — clear it so the fingerprint button
              // stops offering a dead end, and fall back to PIN login.
              clearSavedBiometric(APP_NAME);
              throw new Error("Saved fingerprint login is no longer valid. Please login with your PIN.");
            }
          },
        },
        onSubmit: async ({ staffId, pin }) => {
          const { profile, secret } = await loginWithPin(staffId, pin);
          setLastStaffId(APP_NAME, profile.staffId || staffId);
          pendingBiometricOffer = { staffId: profile.staffId || staffId, name: profile.name, ...secret };
        },
      });

      onAuthChange((user) => {
        loginScreen.style.display = user ? "none" : "flex";
        appShell.style.display = user ? "block" : "none";
        if (user && mountedForUid !== user.uid) {
          mountedForUid = user.uid;
          pinLogin?.destroy(); // P9 fix: stop the login keypad's global
                                // keydown listener from stealing digit/
                                // backspace input meant for in-app fields.
          watchOwnActiveStatus(user.uid);
          mountMarkerApp(markerAppMount, user, { onLogout: () => logout() }).then(() => {
            if (pendingBiometricOffer) {
              maybeOfferBiometricEnroll(APP_NAME, pendingBiometricOffer);
              pendingBiometricOffer = null;
            }
          }).catch((err) => {
            markerAppMount.innerHTML = `<div class="page"><div class="msg msg--err">${err.message}</div></div>`;
          });
        }
        if (!user) {
          mountedForUid = null;
          stopActiveListener();
          markerAppMount.innerHTML = "";
        }
      });
    })();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch((err) => {
        console.warn("Service worker registration failed:", err);
      });
    }
  </script>
</body>
</html>
